# GOSpeak Client Release —— 三端独立发布（web / desktop / mobile）。
#
# 触发方式（三选一，互不干扰）：
#   workflow_dispatch   version=1.4.0-rc.1（默认 components=all：三条产物线全部构建发布）
#   workflow_call       tag=<gospeak-<component>-v<version>>（version-bump.yml 调用）
#   push tag            gospeak-web-v* / gospeak-desktop-v* / gospeak-mobile-v*
#
# 每个端点只发布到**自己的** Release；资产名由 scripts/release-naming.mjs 派生；
# 每个 Release 末尾补 SHASUMS-<tag>.txt（同时发一份 SHA256SUMS-<tag>.txt 兼容仓内旧命名）。
# tag 不存在时指向本次 release HEAD；已存在但不指向 HEAD 时重指向（rc 阶段允许）。
#
# 产物线与命名：
#   web      gospeak-web-v<ver>-dist.tar.gz                        （web/dist）
#   desktop  gospeak-desktop-v<ver>-<target>.{dmg,deb,tar.gz,exe}  （5 腿原生矩阵）
#   mobile   gospeak-mobile-v<ver>-debug.apk                       （Android assembleDebug）
name: Release

on:
  push:
    tags: ["gospeak-web-v*", "gospeak-desktop-v*", "gospeak-mobile-v*"]
  workflow_call:
    inputs:
      tag:
        description: "要发布的 tag（gospeak-<component>-v<version>）"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（例：1.4.0-rc.1）"
        required: true
        default: "1.4.0-rc.1"
        type: string
      components:
        description: "发布范围：all | web | desktop | mobile"
        required: false
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── 版本 / tag / Release 前置 ─────────────────────────────────────────────
  # 一处解析版本，三端共用：tag、Release、资产名不会各说各话。
  # 同时校验 .github/versions/<component>.yaml 的声明版本，避免发错版本。
  meta:
    name: Resolve version, tags and releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      web_tag: ${{ steps.resolve.outputs.web_tag }}
      desktop_tag: ${{ steps.resolve.outputs.desktop_tag }}
      mobile_tag: ${{ steps.resolve.outputs.mobile_tag }}
      build_web: ${{ steps.resolve.outputs.build_web }}
      build_desktop: ${{ steps.resolve.outputs.build_desktop }}
      build_mobile: ${{ steps.resolve.outputs.build_mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version, tags and releases
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMPONENTS: ${{ inputs.components }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sha="$(git rev-parse HEAD)"
          version=""
          component=""

          if [ -n "${INPUT_TAG:-}" ]; then
            parsed="$(node scripts/release-naming.mjs parse "$INPUT_TAG")"
            component="${parsed%% *}"
            version="${parsed##* }"
          elif [ "${EVENT_REF_TYPE:-}" = "tag" ]; then
            parsed="$(node scripts/release-naming.mjs parse "$EVENT_REF_NAME")"
            component="${parsed%% *}"
            version="${parsed##* }"
          else
            version="${INPUT_VERSION:-}"
            if [ -z "$version" ]; then
              echo "::error::workflow_dispatch 需要 version 输入（例：1.4.0-rc.1）"
              exit 1
            fi
          fi

          want="${INPUT_COMPONENTS:-all}"

          wants() {
            local c="$1"
            if [ -n "$component" ]; then
              [ "$c" = "$component" ]
              return $?
            fi
            if [ "$want" = "all" ] || [ "$want" = "$c" ]; then
              return 0
            fi
            return 1
          }

          # .github/versions/<component>.yaml 是版本单一事实源，发布前必须与输入一致。
          declared_version() {
            awk '/^version:/{print $2; exit}' ".github/versions/$1.yaml" | tr -d '"'
          }

          for c in web desktop mobile; do
            if ! wants "$c"; then continue; fi
            declared="$(declared_version "$c")"
            if [ "$declared" != "$version" ]; then
              echo "::error::.github/versions/$c.yaml 声明 ${declared}，与本次发布版本 ${version} 不一致"
              exit 1
            fi
          done

          prerelease_flag() {
            case "$version" in
              *-*) echo "--prerelease" ;;
              *) echo "--latest" ;;
            esac
          }

          # 打 tag（不存在则创建；已存在但不指向本次 release HEAD 则重指向），
          # 并确保 Release 已创建。资产由各构建 job 自行上传。
          publish() {
            local c="$1" tag at
            tag="$(node scripts/release-naming.mjs tag "$c" "$version")"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              at="$(git rev-parse "refs/tags/$tag^{commit}")"
              if [ "$at" != "$sha" ]; then
                echo "::notice::tag $tag 指向 ${at}，重指向本次 release HEAD $sha" >&2
                git tag -f "$tag" "$sha" >&2
                git push --force origin "refs/tags/$tag" >&2
              fi
            else
              echo "::notice::创建 tag $tag -> $sha" >&2
              git tag "$tag" "$sha" >&2
              git push origin "refs/tags/$tag" >&2
            fi

            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::Release $tag 已存在，资产稍后覆盖上传" >&2
            else
              gh release create "$tag" --verify-tag --title "$tag" --generate-notes $(prerelease_flag) >&2
            fi
            printf '%s' "$tag"
          }

          for c in web desktop mobile; do
            if wants "$c"; then
              tag="$(publish "$c")"
              echo "::notice::$c -> $tag"
              echo "${c}_tag=$tag" >> "$GITHUB_OUTPUT"
              echo "build_${c}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${c}_tag=" >> "$GITHUB_OUTPUT"
              echo "build_${c}=false" >> "$GITHUB_OUTPUT"
            fi
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::version=$version sha=$sha"

  # ── 1) Web dist ───────────────────────────────────────────────────────────
  web:
    name: Web dist
    needs: meta
    if: needs.meta.outputs.build_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web dist
        run: GOSPEAK_TARGET=web pnpm --filter @gospeak/web build
      - name: Archive web dist
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html 不存在"; exit 1; }
          asset="gospeak-web-v${VERSION}-dist.tar.gz"
          tar -czf "$asset" -C web dist
          ls -lh "$asset"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.web_tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" gospeak-web-v${{ needs.meta.outputs.version }}-dist.tar.gz --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

  # ── 2) Desktop 全平台安装包（原生矩阵）────────────────────────────────────
  # 每腿只跑自己的原生平台：dmg 必须 macOS 产出、NSIS 安装器在 Windows 上产出。
  # 显式 -platform=<goos>/<goarch>，保证产物架构与 target 命名一致。
  desktop:
    name: Desktop ${{ matrix.target }}
    needs: meta
    if: needs.meta.outputs.build_desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14（arm64）已被 GitHub 退役：任务会在获得 runner 之前被直接取消
          # （annotation: The configuration 'macos-14-arm64-us-default' is not supported）。
          # macos-15 是当前可用的 arm64 镜像，仍产出 darwin-arm64 的 dmg。
          - runner: macos-15
            target: darwin-arm64
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            target: darwin-amd64
            goos: darwin
            goarch: amd64
          - runner: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            goos: linux
            goarch: arm64
          - runner: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Build desktop frontend
        # build:desktop 是 `GOSPEAK_TARGET=desktop vite build && tsc` 的 POSIX 前缀写法，
        # 而 Windows 上 npm/pnpm 用 cmd.exe 跑 script，前缀会被当成命令名直接失败。
        # Windows 腿改用等价的两步（环境变量由 step env 提供），其余平台走原脚本。
        env:
          GOSPEAK_TARGET: desktop
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            pnpm --filter @gospeak/web exec vite build
            pnpm --filter @gospeak/web exec tsc
          else
            pnpm --filter @gospeak/web build:desktop
          fi
      - name: Sync frontend into go:embed directory
        run: |
          set -euo pipefail
          rm -rf desktop/webui/dist
          mkdir -p desktop/webui/dist
          cp -R web/dist-desktop/. desktop/webui/dist/
          test -f desktop/webui/dist/index.html
      - name: Pre-compress embedded assets (best effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v gzip > /dev/null 2>&1 || { echo "::notice::gzip 不可用，跳过预压缩（宿主运行时会兜底）"; exit 0; }
          for ext in js css html json svg txt xml map wasm; do
            find desktop/webui/dist -type f -name "*.$ext" -exec gzip -9 -k -f {} +
          done
      - name: Build desktop app (mygo)
        env:
          GOOS_TARGET: ${{ matrix.goos }}
          GOARCH_TARGET: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          pnpm --filter @gospeak/desktop-app exec mygo build -skip-build-command -platform="${GOOS_TARGET}/${GOARCH_TARGET}"
          ls -la desktop/dist || true
      - name: Collect and rename installers
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          GOOS_TARGET: ${{ matrix.goos }}
          GOARCH_TARGET: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          src="desktop/dist/${GOOS_TARGET}-${GOARCH_TARGET}"
          dest="artifacts"
          base="gospeak-desktop-v${VERSION}-${TARGET}"

          if [ ! -d "$src" ]; then
            echo "::error::mygo 没有产出 $src"
            ls -la desktop/dist || true
            exit 1
          fi
          rm -rf "$dest"
          mkdir -p "$dest"

          # find | head 在 pipefail 下会因 SIGPIPE 返回 141，这里吞掉状态只取首行。
          pick() {
            local pattern="$1"
            { find "$src" -type f -name "$pattern" -print 2>/dev/null | head -1; } || true
          }

          add_asset() {
            local file="$1" ext="$2"
            if [ -z "${file:-}" ] || [ ! -f "$file" ]; then
              return 1
            fi
            cp "$file" "$dest/$base.$ext"
            echo "::notice::资产 $base.$ext <- $(basename "$file")"
            return 0
          }

          case "$GOOS_TARGET" in
            darwin)
              add_asset "$(pick '*.dmg')" dmg || { echo "::error::未找到 .dmg"; exit 1; }
              ;;
            linux)
              add_asset "$(pick '*.tar.gz')" tar.gz || { echo "::error::未找到 .tar.gz"; exit 1; }
              add_asset "$(pick '*.deb')" deb || echo "::warning::mygo 未产出 Debian 包，本腿只发布 tar.gz"
              ;;
            windows)
              if ! add_asset "$(pick '*-setup-*.exe')" exe; then
                add_asset "$(pick '*.exe')" exe || { echo "::error::未找到 .exe"; exit 1; }
              fi
              ;;
            *)
              echo "::error::未知平台 $GOOS_TARGET"
              exit 1
              ;;
          esac

          if [ -z "$(ls -A "$dest")" ]; then
            echo "::error::没有任何可发布产物"
            exit 1
          fi
          ls -lh "$dest"
      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.desktop_tag }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          gh release upload "$TAG" artifacts/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

  # ── 3) Mobile（仅 Android，debug APK）──────────────────────────────────────
  # 不用 android-actions/setup-android：runner 自带 SDK，自行接受 licenses 并补齐
  # platform 36 / build-tools / NDK 27.2.12479018（gomobile 才是真正要 NDK 的一步）。
  mobile:
    name: Mobile android
    needs: meta
    if: needs.meta.outputs.build_mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxyrules/go.mod
          cache: false
      - name: Accept licenses and install Android SDK packages
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME}"
          if [ ! -d "$sdk" ]; then
            echo "::error::runner 未自带 Android SDK（${sdk}）"
            exit 1
          fi
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_bin" ]; then
            sdkmanager_bin="$sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$sdkmanager_bin" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          # yes | sdkmanager 收尾会因 SIGPIPE 非零退出，不代表 licenses 没写入。
          yes 2>/dev/null | "$sdkmanager_bin" --sdk_root="$sdk" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_bin" --sdk_root="$sdk" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$sdk/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          ls "$sdk/ndk"
      - name: gomobile init
        run: |
          set -euo pipefail
          cd proxyrules
          go mod download
          go tool gomobile init
      - name: Sync mobile project (no bind)
        run: pnpm --filter @gospeak/mobile sync:no-bind
      - name: Bind proxyrules for Android
        run: pnpm --filter @gospeak/mobile bind:rules:android
      - name: Build Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.mobile_tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          apk_dir="mobile/android/app/build/outputs/apk/debug"
          apk="$(find "$apk_dir" -type f -name '*.apk' -print -quit)"
          if [ -z "${apk:-}" ]; then
            echo "::error::APK 未产出（${apk_dir}）"
            ls -la "$apk_dir" || true
            exit 1
          fi
          asset="gospeak-mobile-v${VERSION}-debug.apk"
          cp "$apk" "$asset"
          ls -lh "$asset"
          gh release upload "$TAG" "$asset" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

  # ── 4) 每个 Release 补 SHASUMS-<tag>.txt ──────────────────────────────────
  # 校验和必须覆盖该 Release 的**全部**资产，所以放在所有构建 job 之后统一生成。
  checksums:
    name: Publish SHASUMS
    needs: [meta, web, desktop, mobile]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # gh 需要 git 上下文才能定位仓库；缺 checkout 时 release view 会全部报"不存在"。
      - uses: actions/checkout@v4
      - name: Write and upload SHASUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WEB_TAG: ${{ needs.meta.outputs.web_tag }}
          DESKTOP_TAG: ${{ needs.meta.outputs.desktop_tag }}
          MOBILE_TAG: ${{ needs.meta.outputs.mobile_tag }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"

          publish_checksums() {
            local tag="$1" dir count
            if [ -z "${tag:-}" ]; then
              return 0
            fi
            if ! gh release view "$tag" > /dev/null 2>&1; then
              echo "::warning::Release $tag 不存在，跳过校验和"
              return 0
            fi
            dir="$work/$tag"
            mkdir -p "$dir"
            gh release download "$tag" -D "$dir" --clobber
            rm -f "$dir/SHASUMS-$tag.txt" "$dir/SHA256SUMS-$tag.txt"
            count="$(find "$dir" -maxdepth 1 -type f | wc -l)"
            if [ "$count" -eq 0 ]; then
              echo "::error::Release $tag 没有任何资产，无法生成校验和"
              return 1
            fi
            ( cd "$dir" && sha256sum -- * > "SHASUMS-$tag.txt" )
            cp "$dir/SHASUMS-$tag.txt" "$dir/SHA256SUMS-$tag.txt"
            gh release upload "$tag" "$dir/SHASUMS-$tag.txt" "$dir/SHA256SUMS-$tag.txt" --clobber
            echo "::group::SHASUMS-$tag.txt"
            cat "$dir/SHASUMS-$tag.txt"
            echo "::endgroup::"
          }

          publish_checksums "${WEB_TAG:-}"
          publish_checksums "${DESKTOP_TAG:-}"
          publish_checksums "${MOBILE_TAG:-}"

          # 验收：desktop Release 至少 4 个安装包（dmg/deb/tar.gz/exe）。
          if [ -n "${DESKTOP_TAG:-}" ]; then
            total="$(gh release view "$DESKTOP_TAG" --json assets --jq '.assets | length')"
            installers=$((total - 2))
            echo "::notice::desktop 资产 $total 个（含 2 个校验和），安装包 $installers 个"
            if [ "$installers" -lt 4 ]; then
              echo "::error::desktop Release 安装包不足 4 个"
              gh release view "$DESKTOP_TAG" --json assets --jq '.assets[].name'
              exit 1
            fi
          fi

          {
            echo "## Release 资产清单"
            echo
            for tag in "${WEB_TAG:-}" "${DESKTOP_TAG:-}" "${MOBILE_TAG:-}"; do
              if [ -z "${tag:-}" ]; then continue; fi
              echo "### $tag"
              echo
              gh release view "$tag" --json assets --jq '.assets[].name'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
