pre-commit:
  parallel: true
  commands:
    "biome check":
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    "go vet proxyrules":
      glob: "proxyrules/**/*.go"
      run: cd proxyrules && go vet ./...

commit-msg:
  commands:
    "commitlint":
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    "biome ci":
      run: npx @biomejs/biome ci --files-ignore-unknown=true ./web ./packages ./scripts ./desktop ./mobile
    "hook dependency ratchet":
      run: node scripts/check-hook-deps.mjs
    "protocol sync":
      run: node scripts/check-protocol-sync.mjs
    "radius tokens":
      run: node scripts/check-radius-tokens.mjs
    "desktop bridge contract":
      run: node scripts/check-desktop-commands.mjs
    "mobile bridge contract":
      run: node scripts/check-mobile-bridge.mjs
    "typecheck":
      run: pnpm typecheck
